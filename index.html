<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>DINO TERPS 76 🍣</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'M PLUS Rounded 1c', 'Orbitron', sans-serif;
      background: #000;
      color: #ffe0f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      position: relative;
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') no-repeat center center fixed;
      background-size: cover;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,0,20,0.82);
      backdrop-filter: blur(2.5px);
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding-bottom: 180px;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(20,0,30,0.92);
      backdrop-filter: blur(14px);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,80,180,0.4);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-inner {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }
    .header-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
      border: 2px solid #ff50b4;
      box-shadow: 0 0 14px rgba(255,80,180,0.6);
    }
    .header-title {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 1.6px;
      color: #ff50b4;
      text-shadow: 0 0 14px rgba(255,80,180,0.7);
    }
    .back-btn {
      position: absolute;
      left: 16px;
      background: rgba(255,80,180,0.25);
      color: #ff50b4;
      border: 1px solid #ff50b4;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .welcome {
      padding: 20px 16px;
      background: linear-gradient(to right, rgba(20,0,30,0.85), rgba(50,0,60,0.45));
      border-bottom: 1px solid rgba(255,80,180,0.35);
    }
    .welcome-inner {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .welcome-emoji {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,80,180,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 0 18px rgba(255,80,180,0.45);
    }

    #products-grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(20,5,30,0.75);
      border: 1px solid rgba(255,80,180,0.4);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: all 0.25s;
      cursor: pointer;
    }
    .card:hover {
      transform: scale(1.04);
      border-color: #ff50b4;
      box-shadow: 0 0 22px rgba(255,80,180,0.45);
    }
    .card-img {
      height: 230px;
      background: #000;
      position: relative;
    }
    .card-img video, .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge-star {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ff50b4;
      color: #000;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: bold;
    }
    .card-body {
      padding: 12px;
    }
    .card-title {
      font-size: 1.15rem;
      color: white;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .card-info {
      font-size: 0.9rem;
      color: #ffccdd;
    }

    #product-detail { display: none; padding-bottom: 160px; }
    .product-hero { height: 340px; background: #000; position: relative; }
    .product-hero video, .product-hero img { width: 100%; height: 100%; object-fit: cover; }
    .product-title {
      padding: 16px;
      font-size: 2rem;
      font-weight: 900;
      color: #ff50b4;
      text-shadow: 0 0 14px rgba(255,80,180,0.8);
    }
    .badges { padding: 0 16px 16px; display: flex; flex-wrap: wrap; gap: 10px; }
    .badge {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: bold;
    }
    .badge-strain {
      background: rgba(255,80,180,0.3);
      color: #ff50b4;
      border: 1px solid #ff50b4;
    }
    .strain-section {
      padding: 0 16px 24px;
      color: #ff80d0;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .quantity-section {
      margin: 0 16px 20px;
      padding: 20px;
      background: rgba(10,0,20,0.65);
      border: 1px solid rgba(255,80,180,0.5);
      border-radius: 16px;
    }
    .quantity-title {
      font-size: 1.25rem;
      color: #ff50b4;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .quantity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
    }
    .qty-btn {
      background: rgba(255,80,180,0.22);
      border: 1px solid #ff50b4;
      color: white;
      padding: 14px 8px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      transition: 0.25s;
    }
    .qty-btn:hover, .qty-btn.selected {
      background: #ff50b4;
      color: black;
    }
    .add-to-cart {
      margin: 0 16px 24px;
      background: #ff50b4;
      color: black;
      border: none;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,80,180,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* Panier */
    #cart-page { padding: 16px; }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .cart-item {
      background: rgba(20,5,30,0.8);
      border: 1px solid rgba(255,80,180,0.4);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-item-info strong { color: #ffccdd; }
    .delete-item {
      background: #ff3366;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
    }
    #cart-total {
      text-align: center;
      font-size: 1.35rem;
      color: #ff50b4;
      margin: 20px 0;
      font-weight: bold;
    }

    .questionnaire {
      background: rgba(10,0,20,0.75);
      border: 1px solid #ff50b4;
      border-radius: 16px;
      padding: 24px;
      margin-top: 28px;
    }
    .question { margin-bottom: 24px; }
    .question-label {
      display: block;
      font-size: 1.15rem;
      color: #ff80d0;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .option-btn {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      background: rgba(255,80,180,0.22);
      border: 1px solid #ff50b4;
      color: white;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .option-btn.active {
      background: #ff50b4;
      color: black;
      font-weight: bold;
    }
    input[type="time"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ff50b4;
      background: rgba(30,0,40,0.75);
      color: #ffe0f0;
      font-size: 1.1rem;
    }
    textarea { min-height: 100px; resize: vertical; }
    .submit-order {
      width: 100%;
      padding: 18px;
      background: #00cc66;
      color: black;
      border: none;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: bold;
      margin-top: 24px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,204,102,0.6);
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15,0,25,0.96);
      backdrop-filter: blur(18px);
      border-top: 1px solid rgba(255,80,180,0.4);
      padding: 12px 0;
      display: flex;
      z-index: 20;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ff88cc;
      font-size: 0.8rem;
      gap: 4px;
      cursor: pointer;
      padding: 6px 0;
    }
    .nav-item.active { color: #ff50b4; }
    #cart-badge {
      position: absolute;
      top: -6px;
      right: 20px;
      background: #ff3366;
      color: white;
      border-radius: 50%;
      padding: 3px 7px;
      font-size: 0.7rem;
      min-width: 18px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="overlay"></div>
  <div class="content">

    <header>
      <button class="back-btn" id="btn-back" style="display:none;">← Retour</button>
      <div class="header-inner">
        <img src="https://via.placeholder.com/80/000/fff?text=DINO" alt="Logo" class="header-logo">
        <div class="header-title">DINO TERPS 76</div>
      </div>
    </header>

    <!-- Accueil -->
    <div id="home-page">
      <section class="welcome">
        <div class="welcome-inner">
          <div class="welcome-emoji">🍣</div>
          <div>
            <h2 id="welcome-name">Chargement...</h2>
            <p>Bienvenue sur le shop premium</p>
          </div>
        </div>
      </section>
      <div id="products-grid"></div>
    </div>

    <!-- Détail produit -->
    <div id="product-detail">
      <div class="product-hero">
        <video id="detail-video" autoplay muted loop playsinline></video>
      </div>
      <div class="product-title" id="detail-title"></div>
      <div class="badges">
        <div class="badge badge-strain" id="detail-strain"></div>
      </div>
      <div class="strain-section" id="detail-strain-desc"></div>
      <div class="quantity-section">
        <div class="quantity-title"><span>🛍️</span> Choisir la quantité</div>
        <div class="quantity-grid" id="qty-grid"></div>
      </div>
      <button class="add-to-cart" id="add-to-cart-btn"><span>🛒</span> Ajouter au panier</button>
    </div>

    <!-- Panier -->
    <div id="cart-page" style="display:none;">
      <div class="cart-header">
        <h2 style="color:#ff50b4; font-size:1.5rem;">Ton Panier</h2>
        <button id="clear-cart-btn" style="background:#ff3366; color:white; border:none; padding:8px 16px; border-radius:10px; cursor:pointer; display:none;">Vider</button>
      </div>
      <div id="cart-items"></div>
      <div id="cart-total"></div>

      <div class="questionnaire" id="questionnaire">
        <div class="question">
          <span class="question-label">Mode de récupération :</span>
          <button class="option-btn" data-type="pickup">Venir sur place</button>
          <button class="option-btn" data-type="delivery">Livraison</button>
        </div>

        <div id="pickup-questions" style="display:none;">
          <div class="question">
            <span class="question-label">Pour quelle heure ?</span>
            <input type="time" id="pickup-time">
          </div>
        </div>

        <div id="delivery-questions" style="display:none;">
          <div class="question">
            <span class="question-label">Heure souhaitée</span>
            <input type="time" id="delivery-time">
          </div>
          <div class="question">
            <span class="question-label">Adresse complète</span>
            <input type="text" id="delivery-address" placeholder="Rue, numéro, ville...">
          </div>
          <div class="question">
            <span class="question-label">Précisions / étage / code</span>
            <textarea id="delivery-details" placeholder="Interphone, digicode, étage..."></textarea>
          </div>
        </div>

        <button class="submit-order" id="submit-order-btn">Passer la commande</button>
      </div>
    </div>

    <!-- Navigation -->
    <nav>
      <div class="nav-item active" id="nav-home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Accueil</span>
      </div>
      <div class="nav-item" id="nav-cart">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span>Panier</span>
        <span id="cart-badge">0</span>
      </div>
      <div class="nav-item" id="nav-infos">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>Infos</span>
      </div>
    </nav>

  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
tg.disableVerticalSwipes();

const user = tg.initDataUnsafe?.user || {};
document.getElementById('welcome-name').textContent = user.first_name ? `Yo ${user.first_name} !` : 'Bienvenue !';

const products = {
  cali: {
    title: '🇺🇸 Cali weed 🌳',
    strain: 'Runtz 🌈✅  Tropicana Strawberry 🌴🍓✅',
    video: 'https://via.placeholder.com/400x600/111/eee?text=Cali+Video',
    quantities: [
      {qty:'3G', price:'40 €'},
      {qty:'5G', price:'60 €'},
      {qty:'10G', price:'120 €'},
      {qty:'20G', price:'230 €'},
      {qty:'25G', price:'300 €'}
    ]
  },
  gaz: {
    title: '⚡️ Dry 90u',
    strain: 'Papaya dolce 🥭 ✅  Mimi cheese 🧀 ✅',
    video: 'https://via.placeholder.com/400x600/111/eee?text=Gaz+Video',
    quantities: [
      {qty:'10G', price:'130 €'},
      {qty:'25G', price:'240 €'},
      {qty:'50G', price:'450 €'}
    ]
  },
  farm: {
    title: '🥶 FRESH FROZEN SIFT',
    strain: 'PERMANENT MAKER x GELATO 41 ⛽️ 🍦 ✅',
    video: 'https://via.placeholder.com/400x600/111/eee?text=Farm+Video',
    quantities: [
      {qty:'5G', price:'70 €'},
      {qty:'10G', price:'140 €'},
      {qty:'20G', price:'250 €'},
      {qty:'25G', price:'300 €'}
    ]
  },
  '120u': {
    title: 'Dry 120u ⚡️',
    strain: 'Candy Gaz 🍬✅  Glitter Bomb 💣✅  Apple Mintz 🍏✅',
    video: 'https://via.placeholder.com/400x600/111/eee?text=120u+Video',
    quantities: [
      {qty:'5G', price:'70 €'},
      {qty:'10G', price:'140 €'},
      {qty:'20G', price:'260 €'},
      {qty:'25G', price:'310 €'}
    ]
  },
  french: {
    title: 'STATIC SIFT ⚡️🥇🥇',
    strain: 'LARRY POP TARTS 🍋🍰 ✅  CALYPO ⛽️🫐✅',
    video: 'https://via.placeholder.com/400x600/111/eee?text=French+Video',
    quantities: [
      {qty:'5G', price:'70 €'},
      {qty:'10G', price:'130 €'},
      {qty:'20G', price:'280 €'},
      {qty:'50G', price:'550 €'}
    ]
  }
};

let cart = JSON.parse(localStorage.getItem('cart')) || [];

function saveCart() {
  localStorage.setItem('cart', JSON.stringify(cart));
  updateBadge();
}

function updateBadge() {
  const badge = document.getElementById('cart-badge');
  badge.textContent = cart.length || '';
  badge.style.display = cart.length > 0 ? 'inline-block' : 'none';
}

function hideAllPages() {
  ['home-page','product-detail','cart-page'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById('btn-back').style.display = 'none';
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
}

function renderProducts() {
  const grid = document.getElementById('products-grid');
  grid.innerHTML = '';
  Object.entries(products).forEach(([key, p]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-img">
        <img src="${p.video.replace('Video','600')}" alt="${p.title}">
        <div class="badge-star">★</div>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-info">${p.strain.split('\n')[0]}</div>
      </div>`;
    card.onclick = () => openProductDetail(key);
    grid.appendChild(card);
  });
}

function openProductDetail(key) {
  const p = products[key];
  if (!p) return;

  document.getElementById('detail-video').innerHTML = `<source src="${p.video}" type="video/mp4">`;
  document.getElementById('detail-title').textContent = p.title;
  document.getElementById('detail-strain').textContent = p.strain.split('\n')[0];
  document.getElementById('detail-strain-desc').innerHTML = p.strain.replace(/\n/g, '<br>');

  const grid = document.getElementById('qty-grid');
  grid.innerHTML = '';
  p.quantities.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'qty-btn';
    btn.dataset.idx = i;
    btn.innerHTML = `${q.qty}<br><small>${q.price}</small>`;
    btn.onclick = () => {
      grid.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });

  hideAllPages();
  document.getElementById('product-detail').style.display = 'block';
  document.getElementById('btn-back').style.display = 'block';
  document.getElementById('nav-home').classList.add('active');
}

document.getElementById('btn-back').onclick = () => {
  hideAllPages();
  document.getElementById('home-page').style.display = 'block';
  document.getElementById('nav-home').classList.add('active');
};

document.getElementById('add-to-cart-btn').onclick = () => {
  const selected = document.querySelector('#qty-grid .qty-btn.selected');
  if (!selected) return alert('Choisis une quantité stp !');

  const title = document.getElementById('detail-title').textContent;
  const key = Object.keys(products).find(k => products[k].title === title);
  const item = products[key].quantities[selected.dataset.idx];

  cart.push({ title, qty: item.qty, price: item.price });
  saveCart();
  alert('Produit ajouté au panier ✓');
};

function showCart() {
  hideAllPages();
  document.getElementById('cart-page').style.display = 'block';
  document.getElementById('nav-cart').classList.add('active');

  const container = document.getElementById('cart-items');
  container.innerHTML = '';

  if (cart.length === 0) {
    container.innerHTML = '<p style="text-align:center; color:#aaa; padding:80px 20px;">Ton panier est vide...</p>';
    document.getElementById('questionnaire').style.display = 'none';
    document.getElementById('clear-cart-btn').style.display = 'none';
    document.getElementById('cart-total').textContent = '';
    return;
  }

  cart.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'cart-item';
    row.innerHTML = `
      <div class="cart-item-info">
        <strong>${item.title}</strong><br>
        ${item.qty} — ${item.price}
      </div>
      <button class="delete-item" data-index="${index}">X</button>`;
    container.appendChild(row);
  });

  document.querySelectorAll('.delete-item').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.index);
      cart.splice(idx, 1);
      saveCart();
      showCart();
    };
  });

  document.getElementById('clear-cart-btn').style.display = 'block';
  document.getElementById('questionnaire').style.display = 'block';
  document.getElementById('cart-total').textContent = `Total articles : ${cart.length}`;
}

document.getElementById('clear-cart-btn').onclick = () => {
  if (confirm('Vider complètement le panier ?')) {
    cart = [];
    saveCart();
    showCart();
  }
};

document.querySelectorAll('.option-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const type = btn.dataset.type;
    document.getElementById('pickup-questions').style.display = type === 'pickup' ? 'block' : 'none';
    document.getElementById('delivery-questions').style.display = type === 'delivery' ? 'block' : 'none';
  };
});

document.getElementById('submit-order-btn').onclick = () => {
  const modeBtn = document.querySelector('.option-btn.active');
  if (!modeBtn) return alert('Choisis un mode de récupération !');

  const mode = modeBtn.dataset.type;
  let text = `Commande de ${user.first_name || 'Client'} (@${user.username || 'inconnu'})\n\n`;
  text += `Mode : ${mode === 'pickup' ? 'Meet-up' : 'Livraison'}\n\n`;

  cart.forEach(i => text += `→ ${i.title}  ${i.qty} (${i.price})\n`);

  if (mode === 'pickup') {
    const time = document.getElementById('pickup-time').value;
    if (time) text += `\nHeure meet-up : ${time}`;
  } else {
    const time = document.getElementById('delivery-time').value;
    const addr = document.getElementById('delivery-address').value.trim();
    const det = document.getElementById('delivery-details').value.trim();
    if (time) text += `\nHeure souhaitée : ${time}`;
    if (addr) text += `\nAdresse : ${addr}`;
    if (det)  text += `\nPrécisions : ${det}`;
  }

  alert("Commande prête !\n\nCopie-colle ce message à @DINO76S :\n\n" + text);

};
