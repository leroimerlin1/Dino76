<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>DINO TERPS 76</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'M PLUS Rounded 1c', 'Orbitron', sans-serif;
      background:#000;
      color:#ffe0f0;
      min-height:100vh;
      overflow-x:hidden;
    }
    .container {
      position:relative;
      min-height:100vh;
      background: url('dino.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .overlay {
      position:absolute;
      inset:0;
      background:rgba(10,0,20,0.82);
      backdrop-filter:blur(2.5px);
      z-index:1;
    }
    .content {
      position:relative;
      z-index:2;
      min-height:100vh;
    }

    header {
      position:sticky;
      top:0;
      background:rgba(20,0,30,0.92);
      backdrop-filter:blur(14px);
      padding:10px 16px;
      border-bottom:1px solid rgba(255,80,180,0.4);
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .header-inner {
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      max-width:400px;
    }
    .header-logo {
      width:38px;
      height:38px;
      border-radius:50%;
      object-fit:cover;
      margin-right:12px;
      box-shadow:0 0 12px rgba(255,80,180,0.6);
      border:2px solid #ff50b4;
    }
    .header-title {
      font-size:1.35rem;
      font-weight:900;
      letter-spacing:1.5px;
      color:#ff50b4;
      text-shadow:0 0 12px rgba(255,80,180,0.7);
    }
    .back-btn {
      position:absolute;
      left:16px;
      background:rgba(255,80,180,0.2);
      color:#ff50b4;
      border:1px solid #ff50b4;
      padding:8px 14px;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .welcome {
      padding:18px 16px;
      background:linear-gradient(to right, rgba(20,0,30,0.8), rgba(50,0,60,0.4));
      border-bottom:1px solid rgba(255,80,180,0.3);
    }
    .welcome-inner {
      display:flex;
      align-items:center;
      gap:14px;
    }
    .welcome-emoji {
      width:52px;
      height:52px;
      border-radius:50%;
      background:rgba(255,80,180,0.15);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:2rem;
      box-shadow:0 0 16px rgba(255,80,180,0.4);
    }

    #products-grid {
      padding:16px;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
      gap:14px;
      padding-bottom:100px;
    }
    .card {
      background:rgba(20,5,30,0.7);
      border:1px solid rgba(255,80,180,0.4);
      border-radius:12px;
      overflow:hidden;
      backdrop-filter:blur(6px);
      transition:all 0.22s;
      cursor:pointer;
    }
    .card:hover { transform:scale(1.03); border-color:#ff50b4; }
    .card-img { height:220px; position:relative; background:#000; }
    .card-img video { width:100%; height:100%; object-fit:cover; }
    .badge-star {
      position:absolute; top:8px; left:8px;
      background:#ff50b4; color:#000; font-size:0.7rem; padding:4px 10px; border-radius:999px; font-weight:bold;
    }
    .card-body { padding:12px; }
    .card-title { font-size:1.1rem; color:#fff; margin-bottom:4px; font-weight:700; }
    .card-info { font-size:0.85rem; color:#ffccdd; font-weight:500; }

    #product-detail { display:none; padding:0 0 120px 0; }
    .product-hero { height:320px; position:relative; background:#000; }
    .product-hero video { width:100%; height:100%; object-fit:cover; }
    .product-title { padding:16px; font-size:1.9rem; font-weight:900; color:#ff50b4; text-shadow:0 0 12px rgba(255,80,180,0.75); }
    .badges { padding:0 16px 12px; display:flex; flex-wrap:wrap; gap:8px; }
    .badge { padding:7px 14px; border-radius:999px; font-size:0.9rem; font-weight:bold; }
    .badge-strain { background:rgba(255,80,180,0.28); color:#ff50b4; border:1px solid #ff50b4; }
    .strain-section { padding:0 16px 20px; color:#ff80d0; font-size:1.05rem; line-height:1.6; }
    .strain-title { font-weight:bold; color:#ff50b4; margin-bottom:10px; font-size:1.15rem; }

    .contact-telegram {
      margin:16px;
      background:#0088cc;
      color:white;
      border:none;
      padding:18px;
      font-size:1.15rem;
      font-weight:bold;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      cursor:pointer;
      box-shadow:0 0 18px rgba(0,136,204,0.65);
    }

    #infos-page { display:none; padding:16px; padding-bottom:140px; color:#ffe0f0; font-size:1.05rem; line-height:1.5; }
    #infos-page .section {
      background:rgba(20,5,30,0.75);
      border:1px solid rgba(255,80,180,0.5);
      border-radius:12px;
      padding:16px;
      margin-bottom:16px;
      backdrop-filter:blur(6px);
    }
    #infos-page .section-title {
      font-size:1.4rem;
      color:#ff50b4;
      margin-bottom:12px;
      display:flex;
      align-items:center;
      gap:8px;
      text-shadow:0 0 8px rgba(255,80,180,0.6);
    }

    #reseaux-page { display:none; padding:16px; padding-bottom:140px; color:#ffe0f0; font-size:1.05rem; line-height:1.5; }
    #reseaux-page h1 { color:#ff50b4; font-size:1.8rem; text-align:center; margin:20px 0 30px; text-shadow:0 0 10px rgba(255,80,180,0.8); }
    .reseaux-card {
      background:rgba(20,5,30,0.75);
      border:1px solid rgba(255,80,180,0.5);
      border-radius:12px;
      padding:16px;
      margin-bottom:16px;
      backdrop-filter:blur(6px);
      cursor:pointer;
      transition:0.2s;
    }
    .reseaux-card:hover { transform:scale(1.02); border-color:#ff50b4; box-shadow:0 0 15px rgba(255,80,180,0.4); }
    .reseaux-card .icon { font-size:2.5rem; margin-bottom:10px; }
    .reseaux-card h3 { color:#ff80d0; margin:8px 0; font-size:1.3rem; }

    nav {
      position:fixed;
      bottom:0;
      left:0; right:0;
      background:rgba(15,0,25,0.95);
      backdrop-filter:blur(16px);
      border-top:1px solid rgba(255,80,180,0.35);
      padding:10px 0;
      display:flex;
      justify-content:space-around;
      z-index:20;
    }
    .nav-item {
      display:flex;
      flex-direction:column;
      align-items:center;
      color:#ff88cc;
      font-size:0.75rem;
      gap:4px;
      cursor:pointer;
      flex:1;
      max-width:25%;
      position:relative;
    }
    .nav-item.active { color:#ff50b4; }
  </style>
</head>
<body>

<div class="container">
  <div class="overlay"></div>
  <div class="content">

    <header id="main-header">
      <button class="back-btn" id="btn-back" style="display:none;">← Retour</button>
      <div class="header-inner">
        <img src="dino.jpg" alt="Dino Logo" class="header-logo">
        <div class="header-title">DINO TERPS 76</div>
      </div>
    </header>

    <div id="home-page">
      <section class="welcome">
        <div class="welcome-inner">
          <div class="welcome-emoji">🍣</div>
          <div>
            <h2 id="welcome-name">Chargement...</h2>
            <p>Bienvenue sur le shop premium</p>
          </div>
        </div>
      </section>

      <div id="products-grid">
        <div class="card" data-key="cali"> <!-- ... mêmes cartes produits ... --> </div>
        <div class="card" data-key="gaz">   <!-- ... --> </div>
        <div class="card" data-key="farm">  <!-- ... --> </div>
        <div class="card" data-key="120u">  <!-- ... --> </div>
        <div class="card" data-key="french"><!-- ... --> </div>
      </div>
    </div>

    <div id="product-detail" style="display:none;">
      <div class="product-hero">
        <video id="detail-video" autoplay muted loop playsinline></video>
      </div>
      <div class="product-title" id="detail-title"></div>
      <div class="badges">
        <div class="badge badge-strain" id="detail-strain"></div>
      </div>
      <div class="strain-section" id="detail-strain-desc"></div>

      <button class="contact-telegram" id="contact-telegram-btn">
        <span>✉️</span> Contacter sur Telegram
      </button>
    </div>

    <div id="infos-page" style="display:none;">
      <!-- ... reste identique ... -->
      <div class="section">
        <div class="section-title"><span>📩</span> Contact</div>
        <div class="contact">
          Contactez-nous sur Telegram : 
          <a href="#" onclick="tg.openTelegramLink('https://t.me/DINO76S'); return false;">@DINO76S</a>
        </div>
      </div>
    </div>

    <div id="reseaux-page" style="display:none;">
      <h1>Nos réseaux</h1>
      <div class="reseaux-card" onclick="tg.openLink('https://www.instagram.com/dinoterps76?igsh=b3VjMGo4dGMxc2tz&utm_source=qr')">
        <div class="icon">📸</div>
        <h3>Instagram</h3>
      </div>
      <div class="reseaux-card" onclick="tg.openLink('https://duanym138.org/DINOfslmogx8')">
        <div class="icon">🥔</div>
        <h3>Potato</h3>
      </div>
      <div class="reseaux-card" onclick="tg.openLink('https://t.me/+j7EMkLSIaV83ZmU8')">
        <div class="icon">📢</div>
        <h3>Canal Telegram</h3>
      </div>
      <div class="reseaux-card" onclick="tg.openLink('https://snapchat.com/t/EZAiDCkN')">
        <div class="icon">👻</div>
        <h3>Snapchat</h3>
      </div>
    </div>

    <nav>
      <div class="nav-item active" id="nav-home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Accueil</span>
      </div>
      <div class="nav-item" id="nav-infos">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>Infos</span>
      </div>
      <div class="nav-item" id="nav-reseaux">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Réseaux</span>
      </div>
    </nav>

  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe?.user;
  if (user) {
    document.getElementById('welcome-name').textContent = `Salut ${user.first_name || 'Farmer'} !`;
  } else {
    document.getElementById('welcome-name').textContent = 'Bienvenue !';
  }

  const products = {
    cali:   { key: 'cali',   title: '🇺🇸 Cali weed🌳',        farm: 'Runtz / Tropicana Strawberry', strain: 'Runtz 🌈✅ Tropicana Strawberry 🌴🍓✅',       video: 'cali.mp4',   poster: 'cali-thumb.jpg'   },
    gaz:    { key: 'gaz',    title: '⚡️ Dry 90u',             farm: 'Gaz fruit🍇',                  strain: 'Papaya Dolce 🥭✅ Mimi Cheese 🧀✅',              video: 'gaz.mp4',    poster: 'gaz-thumb.jpg'    },
    farm:   { key: 'farm',   title: '🥶 FRESH FROZEN SIFT',    farm: 'KINGZ FARM 🧑‍🌾',             strain: 'PERMANENT MAKER x GELATO 41 ⛽️🍦✅',              video: 'farm.mp4',   poster: 'farm-thumb.jpg'   },
    '120u': { key: '120u',   title: 'Dry 120u⚡️',             farm: '🧑‍🌾 CALIMOUNTAIN',           strain: 'Candy Gaz 🍬✅ Glitter Bomb 💣✅ Apple Mintz 🍏✅', video: '120u.mp4',   poster: '120u-thumb.jpg'   },
    french: { key: 'french', title: 'STATIC SIFT⚡️🥇🥇',       farm: '🧑🏻‍🌾 DR FRENCH 🧑🏻‍🌾',       strain: 'LARRY POP TARTS 🍋🍰 ✅ - CALYPO ⛽️🫐✅',          video: 'french.mp4', poster: 'french-thumb.jpg' }
  };

  function openProductDetail(key) {
    const p = products[key];
    if (!p) return;

    const hero = document.getElementById('detail-video');
    hero.innerHTML = `<source src="${p.video}" type="video/mp4">`;
    hero.poster = p.poster || '';

    document.getElementById('detail-title').textContent = p.title;
    document.getElementById('detail-strain').textContent = p.strain;
    document.getElementById('detail-strain-desc').innerHTML = `<div class="strain-title">Strain</div>${p.strain}`;

    hideAllPages();
    document.getElementById('product-detail').style.display = 'block';
    document.getElementById('btn-back').style.display = 'inline-block';
  }

  function hideAllPages() {
    document.getElementById('home-page').style.display = 'none';
    document.getElementById('product-detail').style.display = 'none';
    document.getElementById('infos-page').style.display = 'none';
    document.getElementById('reseaux-page').style.display = 'none';
  }

  document.querySelectorAll('#products-grid .card').forEach(card => {
    card.addEventListener('click', () => openProductDetail(card.dataset.key));
  });

  document.getElementById('btn-back').onclick = () => {
    hideAllPages();
    document.getElementById('home-page').style.display = 'block';
    document.getElementById('btn-back').style.display = 'none';
  };

  // Bouton Contact Telegram sur chaque fiche produit
  document.getElementById('contact-telegram-btn').onclick = () => {
    const productName = document.getElementById('detail-title').textContent.trim();
    const message = `Salut ! Je suis intéressé par : ${productName}`;
    const encoded = encodeURIComponent(message);
    tg.openTelegramLink(`https://t.me/DINO76S?text=${encoded}`);
  };

  // Navigation
  document.getElementById('nav-home').addEventListener('click', () => {
    hideAllPages();
    document.getElementById('home-page').style.display = 'block';
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    document.getElementById('nav-home').classList.add('active');
  });

  document.getElementById('nav-infos').addEventListener('click', () => {
    hideAllPages();
    document.getElementById('infos-page').style.display = 'block';
    document.getElementById('btn-back').style.display = 'inline-block';
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    document.getElementById('nav-infos').classList.add('active');
  });

  document.getElementById('nav-reseaux').addEventListener('click', () => {
    hideAllPages();
    document.getElementById('reseaux-page').style.display = 'block';
    document.getElementById('btn-back').style.display = 'inline-block';
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    document.getElementById('nav-reseaux').classList.add('active');
  });
</script>

</body>
</html>
