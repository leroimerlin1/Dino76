<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>DINO TERPS 76</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'M PLUS Rounded 1c', 'Orbitron', sans-serif;
  background:#000;
  color:#ffe0f0;
  min-height:100vh;
  overflow-x:hidden;
}
.container { position:relative; min-height:100vh; background: url('dino.jpg') no-repeat center center fixed; background-size: cover; }
.overlay { position:absolute; inset:0; background:rgba(10,0,20,0.82); backdrop-filter:blur(2.5px); z-index:1; }
.content { position:relative; z-index:2; min-height:100vh; padding-bottom:160px; } /* ← plus de place en bas */

header { position:sticky; top:0; background:rgba(20,0,30,0.92); backdrop-filter:blur(14px); padding:10px 16px; border-bottom:1px solid rgba(255,80,180,0.4); z-index:10; display:flex; align-items:center; justify-content:center; }
.header-inner { display:flex; align-items:center; justify-content:center; width:100%; max-width:400px; }
.header-logo { width:38px; height:38px; border-radius:50%; object-fit:cover; margin-right:12px; box-shadow:0 0 12px rgba(255,80,180,0.6); border:2px solid #ff50b4; }
.header-title { font-size:1.35rem; font-weight:900; letter-spacing:1.5px; color:#ff50b4; text-shadow:0 0 12px rgba(255,80,180,0.7); }
.back-btn { position:absolute; left:16px; background:rgba(255,80,180,0.2); color:#ff50b4; border:1px solid #ff50b4; padding:8px 14px; border-radius:8px; font-weight:bold; cursor:pointer; }

.welcome { padding:18px 16px; background:linear-gradient(to right, rgba(20,0,30,0.8), rgba(50,0,60,0.4)); border-bottom:1px solid rgba(255,80,180,0.3); }
.welcome-inner { display:flex; align-items:center; gap:14px; }
.welcome-emoji { width:52px; height:52px; border-radius:50%; background:rgba(255,80,180,0.15); display:flex; align-items:center; justify-content:center; font-size:2rem; box-shadow:0 0 16px rgba(255,80,180,0.4); }

#products-grid { padding:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; }
.card { background:rgba(20,5,30,0.7); border:1px solid rgba(255,80,180,0.4); border-radius:12px; overflow:hidden; backdrop-filter:blur(6px); transition:all 0.22s; cursor:pointer; }
.card:hover { transform:scale(1.03); border-color:#ff50b4; box-shadow:0 0 20px rgba(255,80,180,0.4); }
.card-img { height:220px; position:relative; background:#000; }
.card-img video { width:100%; height:100%; object-fit:cover; }
.badge-star { position:absolute; top:8px; left:8px; background:#ff50b4; color:#000; font-size:0.7rem; padding:4px 10px; border-radius:999px; font-weight:bold; }
.card-body { padding:12px; }
.card-title { font-size:1.1rem; color:#fff; margin-bottom:4px; font-weight:700; }
.card-info { font-size:0.85rem; color:#ffccdd; font-weight:500; }

#product-detail { display:none; padding:0 0 140px 0; }
.product-hero { height:320px; position:relative; background:#000; }
.product-hero video { width:100%; height:100%; object-fit:cover; }
.product-title { padding:16px; font-size:1.9rem; font-weight:900; color:#ff50b4; text-shadow:0 0 12px rgba(255,80,180,0.75); }
.badges { padding:0 16px 12px; display:flex; flex-wrap:wrap; gap:8px; }
.badge { padding:7px 14px; border-radius:999px; font-size:0.9rem; font-weight:bold; }
.badge-strain { background:rgba(255,80,180,0.28); color:#ff50b4; border:1px solid #ff50b4; }
.strain-section { padding:0 16px 20px; color:#ff80d0; font-size:1.05rem; line-height:1.6; }
.strain-title { font-weight:bold; color:#ff50b4; margin-bottom:10px; font-size:1.15rem; }
.quantity-section { padding:16px; background:rgba(10,0,20,0.6); margin:12px 16px; border-radius:14px; border:1px solid rgba(255,80,180,0.45); }
.quantity-title { font-size:1.15rem; color:#ff50b4; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.quantity-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.qty-btn { background:rgba(255,80,180,0.2); border:1px solid #ff50b4; color:#fff; padding:14px 10px; border-radius:12px; text-align:center; cursor:pointer; font-weight:bold; transition:0.2s; }
.qty-btn:hover, .qty-btn.selected { background:#ff50b4; color:#000; }
.add-to-cart { margin:16px; background:#ff50b4; color:#000; border:none; padding:18px; font-size:1.15rem; font-weight:bold; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:12px; cursor:pointer; box-shadow:0 0 18px rgba(255,80,180,0.65); }

nav { position:fixed; bottom:0; left:0; right:0; background:rgba(15,0,25,0.95); backdrop-filter:blur(16px); border-top:1px solid rgba(255,80,180,0.35); padding:10px 0; display:flex; justify-content:space-around; z-index:20; }
.nav-item { display:flex; flex-direction:column; align-items:center; color:#ff88cc; font-size:0.75rem; gap:4px; cursor:pointer; flex:1; max-width:25%; position:relative; }
.nav-item.active { color:#ff50b4; }
#cart-badge { position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; padding:2px 6px; font-size:0.65rem; display:none; }

/* ── Améliorations Panier ── */
#cart-page { padding:16px; }
.cart-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.cart-item {
  background:rgba(20,5,30,0.75);
  border:1px solid rgba(255,80,180,0.35);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:1.05rem;
}
.delete-item {
  background:#ff3366;
  color:white;
  border:none;
  border-radius:50%;
  width:28px;
  height:28px;
  font-weight:bold;
  cursor:pointer;
}
#cart-total { 
  font-size:1.3rem; 
  color:#ff50b4; 
  text-align:center; 
  margin:20px 0; 
  font-weight:bold; 
}
.questionnaire {
  background:rgba(10,0,20,0.7);
  border:1px solid #ff50b4;
  border-radius:14px;
  padding:20px;
  margin-top:24px;
}
.question {
  margin-bottom:20px;
}
.question-label {
  display:block;
  font-size:1.1rem;
  color:#ff80d0;
  margin-bottom:10px;
  font-weight:500;
}
.option-btn {
  background:rgba(255,80,180,0.2);
  border:1px solid #ff50b4;
  color:white;
  padding:14px;
  border-radius:10px;
  width:100%;
  margin:6px 0;
  font-size:1.05rem;
  cursor:pointer;
}
.option-btn.active {
  background:#ff50b4;
  color:black;
  font-weight:bold;
}
input[type="time"], input[type="text"], textarea {
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #ff50b4;
  background:rgba(30,0,40,0.7);
  color:#ffe0f0;
  font-size:1.05rem;
}
textarea { min-height:90px; resize:vertical; }
.submit-order {
  background:#00cc66;
  color:black;
  border:none;
  padding:18px;
  font-size:1.2rem;
  font-weight:bold;
  border-radius:14px;
  width:100%;
  margin-top:20px;
  cursor:pointer;
  box-shadow:0 0 16px rgba(0,204,102,0.5);
}
</style>
</head>
<body>

<div class="container">
  <div class="overlay"></div>
  <div class="content">

    <header id="main-header">
      <button class="back-btn" id="btn-back" style="display:none;">← Retour</button>
      <div class="header-inner">
        <img src="dino.jpg" alt="Dino Logo" class="header-logo">
        <div class="header-title">DINO TERPS 76</div>
      </div>
    </header>

    <div id="home-page">
      <section class="welcome">
        <div class="welcome-inner">
          <div class="welcome-emoji">🍣</div>
          <div>
            <h2 id="welcome-name">Chargement...</h2>
            <p>Bienvenue sur le shop premium</p>
          </div>
        </div>
      </section>

      <div id="products-grid"></div>
    </div>

    <div id="product-detail">
      <div class="product-hero">
        <video id="detail-video" autoplay muted loop playsinline></video>
      </div>
      <div class="product-title" id="detail-title"></div>
      <div class="badges">
        <div class="badge badge-strain" id="detail-strain"></div>
      </div>
      <div class="strain-section" id="detail-strain-desc"></div>
      <div class="quantity-section">
        <div class="quantity-title"><span>🛍️</span> Sélectionner la Quantité</div>
        <div class="quantity-grid" id="qty-grid"></div>
      </div>
      <button class="add-to-cart" id="add-to-cart-btn"><span>🛒</span> Ajouter au Panier</button>
    </div>

    <!-- Infos page (inchangée) -->
    <div id="infos-page" style="display:none; padding:16px; padding-bottom:160px; color:#ffe0f0; font-size:1.05rem; line-height:1.5;">
      <!-- ... ton contenu infos reste identique ... -->
    </div>

    <!-- Réseaux page (inchangée) -->
    <div id="reseaux-page" style="display:none; padding:16px; padding-bottom:160px; color:#ffe0f0; font-size:1.05rem; line-height:1.5;">
      <!-- ... ton contenu réseaux reste identique ... -->
    </div>

    <!-- Panier amélioré -->
    <div id="cart-page" style="display:none;">
      <div class="cart-header">
        <h2 style="font-size:1.4rem; color:#ff50b4;">Votre Panier</h2>
        <button id="clear-cart-btn" style="background:#ff3366; color:white; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; display:none;">Vider</button>
      </div>
      <div id="cart-items"></div>
      <div id="cart-total"></div>

      <div class="questionnaire" id="questionnaire">
        <div class="question">
          <span class="question-label">Mode de récupération :</span>
          <button class="option-btn" data-type="pickup">Venir sur place</button>
          <button class="option-btn" data-type="delivery">Livré</button>
        </div>

        <div id="pickup-questions" style="display:none;">
          <div class="question">
            <span class="question-label">Pour quelle heure ?</span>
            <input type="time" id="pickup-time">
          </div>
        </div>

        <div id="delivery-questions" style="display:none;">
          <div class="question">
            <span class="question-label">Pour quelle heure ?</span>
            <input type="time" id="delivery-time">
          </div>
          <div class="question">
            <span class="question-label">Votre adresse :</span>
            <input type="text" id="delivery-address" placeholder="Adresse complète">
          </div>
          <div class="question">
            <span class="question-label">Détails / questions livraison :</span>
            <textarea id="delivery-details" placeholder="Précisez ici..."></textarea>
          </div>
        </div>

        <button class="submit-order" id="submit-order-btn">Commander</button>
      </div>
    </div>

    <nav>
      <div class="nav-item active" id="nav-home"> <!-- icônes inchangées --> ... </div>
      <div class="nav-item" id="nav-cart"> ... </div>
      <div class="nav-item" id="nav-infos"> ... </div>
      <div class="nav-item" id="nav-reseaux"> ... </div>
    </nav>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
tg.disableVerticalSwipes(); // ← très important pour éviter le swipe fermeture

const user = tg.initDataUnsafe?.user;
document.getElementById('welcome-name').textContent = user ? `Salut ${user.first_name} !` : 'Bienvenue !';

const products = { /* ton objet products reste identique */ };

let cart = JSON.parse(localStorage.getItem('cart')) || [];
function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateBadge(); }
function updateBadge() {
  const b = document.getElementById('cart-badge');
  if (cart.length > 0) { b.textContent = cart.length; b.style.display = 'block'; }
  else b.style.display = 'none';
}

function hideAllPages() {
  document.getElementById('home-page').style.display = 'none';
  document.getElementById('product-detail').style.display = 'none';
  document.getElementById('infos-page').style.display = 'none';
  document.getElementById('reseaux-page').style.display = 'none';
  document.getElementById('cart-page').style.display = 'none';
  document.getElementById('btn-back').style.display = 'none';
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
}

function renderProducts() {
  const grid = document.getElementById('products-grid');
  grid.innerHTML = '';
  Object.keys(products).forEach(key => {
    const p = products[key];
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.key = key;
    card.innerHTML = `
      <div class="card-img">
        <video autoplay muted loop playsinline poster="${p.poster}">
          <source src="${p.video}" type="video/mp4">
        </video>
        <div class="badge-star">★</div>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-info">${p.farm}</div>
      </div>`;
    card.addEventListener('click', () => openProductDetail(key));
    grid.appendChild(card);
  });
}

function openProductDetail(key) {
  const p = products[key];
  if (!p) return;
  document.getElementById('detail-video').innerHTML = `<source src="${p.video}" type="video/mp4">`;
  document.getElementById('detail-video').poster = p.poster || '';
  document.getElementById('detail-title').textContent = p.title;
  document.getElementById('detail-strain').textContent = p.strain.split('\n')[0] || p.strain;
  document.getElementById('detail-strain-desc').innerHTML = `<div class="strain-title">Strain</div>${p.strain.replace(/\n/g, '<br>')}`;

  const grid = document.getElementById('qty-grid');
  grid.innerHTML = '';
  p.quantities.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'qty-btn';
    btn.dataset.index = idx;
    btn.innerHTML = `${item.qty}<br>${item.price}`;
    btn.onclick = () => {
      grid.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });

  hideAllPages();
  document.getElementById('product-detail').style.display = 'block';
  document.getElementById('btn-back').style.display = 'inline-block';
}

document.getElementById('btn-back').onclick = () => {
  hideAllPages();
  document.getElementById('home-page').style.display = 'block';
  document.getElementById('nav-home').classList.add('active');
};

document.getElementById('add-to-cart-btn').onclick = () => {
  const selected = document.querySelector('.qty-btn.selected');
  if (!selected) { alert('Sélectionnez une quantité !'); return; }
  const title = document.getElementById('detail-title').textContent.trim();
  const key = Object.keys(products).find(k => products[k].title === title);
  const item = products[key].quantities[selected.dataset.index];
  cart.push({ title, qty: item.qty, price: item.price });
  saveCart();
  alert('Ajouté au panier !');
  // Option : revenir à l'accueil après ajout
  // document.getElementById('btn-back').click();
};

function showCart() {
  hideAllPages();
  document.getElementById('cart-page').style.display = 'block';
  document.getElementById('nav-cart').classList.add('active');

  const itemsDiv = document.getElementById('cart-items');
  itemsDiv.innerHTML = '';
  if (cart.length === 0) {
    itemsDiv.innerHTML = '<p style="text-align:center; color:#888; padding:60px 0;">Votre panier est vide</p>';
    document.getElementById('questionnaire').style.display = 'none';
    document.getElementById('clear-cart-btn').style.display = 'none';
    document.getElementById('cart-total').textContent = '';
    return;
  }

  cart.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <div>
        <strong>${item.title}</strong><br>
        ${item.qty} — ${item.price}
      </div>
      <button class="delete-item">X</button>`;
    div.querySelector('.delete-item').onclick = () => {
      cart.splice(idx, 1);
      saveCart();
      showCart();
    };
    itemsDiv.appendChild(div);
  });

  document.getElementById('clear-cart-btn').style.display = 'block';
  document.getElementById('questionnaire').style.display = 'block';

  // Affichage total (juste visuel)
  document.getElementById('cart-total').textContent = `Articles : ${cart.length}`;
}

document.getElementById('clear-cart-btn').onclick = () => {
  if (confirm('Vider tout le panier ?')) {
    cart = [];
    saveCart();
    showCart();
  }
};

// Gestion mode récupération
document.querySelectorAll('.option-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const type = btn.dataset.type;
    document.getElementById('pickup-questions').style.display  = type === 'pickup'  ? 'block' : 'none';
    document.getElementById('delivery-questions').style.display = type === 'delivery' ? 'block' : 'none';
  };
});

// Bouton commander (tu peux connecter à Telegram.sendData plus tard)
document.getElementById('submit-order-btn').onclick = () => {
  const mode = document.querySelector('.option-btn.active')?.dataset.type;
  if (!mode) return alert("Choisis un mode de récupération !");

  let message = `Nouvelle commande de ${user?.first_name || 'Client'} !\n\n`;
  message += `Mode: ${mode === 'pickup' ? 'Meet-up' : 'Livraison'}\n\n`;
  cart.forEach(item => message += `• ${item.title} ${item.qty} (${item.price})\n`);

  if (mode === 'pickup') {
    const time = document.getElementById('pickup-time').value;
    if (time) message += `\nHeure meet-up : ${time}`;
  } else {
    const time = document.getElementById('delivery-time').value;
    const addr = document.getElementById('delivery-address').value.trim();
    const details = document.getElementById('delivery-details').value.trim();
    if (time) message += `\nHeure livraison : ${time}`;
    if (addr) message += `\nAdresse : ${addr}`;
    if (details) message += `\nDétails : ${details}`;
  }

  alert("Commande prête ! Envoie-la manuellement à @DINO76S pour le moment.\n\n" + message);
  // Plus tard → tg.sendData(message); tg.close();
};

// Navigation
document.getElementById('nav-home').onclick = () => { hideAllPages(); document.getElementById('home-page').style.display='block'; document.getElementById('nav-home').classList.add('active'); };
document.getElementById('nav-cart').onclick = showCart;
document.getElementById('nav-infos').onclick = () => { hideAllPages(); document.getElementById('infos-page').style.display='block'; document.getElementById('nav-infos').classList.add('active'); document.getElementById('btn-back').style.display='none'; };
document.getElementById('nav-reseaux').onclick = () => { hideAllPages(); document.getElementById('reseaux-page').style.display='block'; document.getElementById('nav-reseaux').classList.add('active'); document.getElementById('btn-back').style.display='none'; };

renderProducts();
updateBadge();
showCart(); // Pour forcer l'affichage initial du formulaire si panier non vide (optionnel)
</script>
</body>
</html>
