<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>DINO TERPS 76</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'M PLUS Rounded 1c', 'Orbitron', sans-serif;
      background:#000;
      color:#ffe0f0;
      min-height:100vh;
      overflow-x:hidden;
    }
    .container { position:relative; min-height:100vh; background: url('dino.jpg') no-repeat center center fixed; background-size: cover; }
    .overlay { position:absolute; inset:0; background:rgba(10,0,20,0.82); backdrop-filter:blur(2.5px); z-index:1; }
    .content { position:relative; z-index:2; min-height:100vh; }

    header { position:sticky; top:0; background:rgba(20,0,30,0.92); backdrop-filter:blur(14px); padding:10px 16px; border-bottom:1px solid rgba(255,80,180,0.4); z-index:10; display:flex; align-items:center; justify-content:center; }
    .header-inner { display:flex; align-items:center; justify-content:center; width:100%; max-width:400px; }
    .header-logo { width:38px; height:38px; border-radius:50%; object-fit:cover; margin-right:12px; box-shadow:0 0 12px rgba(255,80,180,0.6); border:2px solid #ff50b4; }
    .header-title { font-size:1.35rem; font-weight:900; letter-spacing:1.5px; color:#ff50b4; text-shadow:0 0 12px rgba(255,80,180,0.7); }
    .back-btn { position:absolute; left:16px; background:rgba(255,80,180,0.2); color:#ff50b4; border:1px solid #ff50b4; padding:8px 14px; border-radius:8px; font-weight:bold; cursor:pointer; }

    .welcome { padding:18px 16px; background:linear-gradient(to right, rgba(20,0,30,0.8), rgba(50,0,60,0.4)); border-bottom:1px solid rgba(255,80,180,0.3); }
    .welcome-inner { display:flex; align-items:center; gap:14px; }
    .welcome-emoji { width:52px; height:52px; border-radius:50%; background:rgba(255,80,180,0.15); display:flex; align-items:center; justify-content:center; font-size:2rem; box-shadow:0 0 16px rgba(255,80,180,0.4); }

    #products-grid { padding:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; padding-bottom:100px; }
    .card { background:rgba(20,5,30,0.7); border:1px solid rgba(255,80,180,0.4); border-radius:12px; overflow:hidden; backdrop-filter:blur(6px); transition:all 0.22s; cursor:pointer; }
    .card:hover { transform:scale(1.03); border-color:#ff50b4; }
    .card-img { height:220px; position:relative; background:#000; }
    .card-img video { width:100%; height:100%; object-fit:cover; }
    .badge-star { position:absolute; top:8px; left:8px; background:#ff50b4; color:#000; font-size:0.7rem; padding:4px 10px; border-radius:999px; font-weight:bold; }
    .card-body { padding:12px; }
    .card-title { font-size:1.1rem; color:#fff; margin-bottom:4px; font-weight:700; }
    .card-info { font-size:0.85rem; color:#ffccdd; font-weight:500; }

    #product-detail { display:none; padding:0 0 120px 0; }
    .product-hero { height:320px; position:relative; background:#000; }
    .product-hero video { width:100%; height:100%; object-fit:cover; }
    .product-title { padding:16px; font-size:1.9rem; font-weight:900; color:#ff50b4; text-shadow:0 0 12px rgba(255,80,180,0.75); }
    .badges { padding:0 16px 12px; display:flex; flex-wrap:wrap; gap:8px; }
    .badge { padding:7px 14px; border-radius:999px; font-size:0.9rem; font-weight:bold; }
    .badge-strain { background:rgba(255,80,180,0.28); color:#ff50b4; border:1px solid #ff50b4; }
    .strain-section { padding:0 16px 20px; color:#ff80d0; font-size:1.05rem; line-height:1.6; }
    .strain-title { font-weight:bold; color:#ff50b4; margin-bottom:10px; font-size:1.15rem; }
    .quantity-section { padding:16px; background:rgba(10,0,20,0.6); margin:12px 16px; border-radius:14px; border:1px solid rgba(255,80,180,0.45); }
    .quantity-title { font-size:1.15rem; color:#ff50b4; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
    .quantity-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .qty-btn { background:rgba(255,80,180,0.2); border:1px solid #ff50b4; color:#fff; padding:14px 10px; border-radius:12px; text-align:center; cursor:pointer; font-weight:bold; transition:0.2s; }
    .qty-btn:hover, .qty-btn.selected { background:#ff50b4; color:#000; }
    .add-to-cart { margin:16px; background:#ff50b4; color:#000; border:none; padding:18px; font-size:1.15rem; font-weight:bold; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:12px; cursor:pointer; box-shadow:0 0 18px rgba(255,80,180,0.65); }

    #infos-page { display:none; padding:16px; padding-bottom:140px; color:#ffe0f0; font-size:1.05rem; line-height:1.5; }
    #reseaux-page { display:none; padding:16px; padding-bottom:140px; color:#ffe0f0; font-size:1.05rem; line-height:1.5; }
    #cart-page { display:none; padding:16px; padding-bottom:140px; }

    nav { position:fixed; bottom:0; left:0; right:0; background:rgba(15,0,25,0.95); backdrop-filter:blur(16px); border-top:1px solid rgba(255,80,180,0.35); padding:10px 0; display:flex; justify-content:space-around; z-index:20; }
    .nav-item { display:flex; flex-direction:column; align-items:center; color:#ff88cc; font-size:0.75rem; gap:4px; cursor:pointer; flex:1; max-width:25%; position:relative; }
    .nav-item.active { color:#ff50b4; }
    #cart-badge { position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; padding:2px 6px; font-size:0.65rem; display:none; }
  </style>
</head>
<body>

<div class="container">
  <div class="overlay"></div>
  <div class="content">

    <header id="main-header">
      <button class="back-btn" id="btn-back" style="display:none;">← Retour</button>
      <div class="header-inner">
        <img src="dino.jpg" alt="Dino Logo" class="header-logo">
        <div class="header-title">DINO TERPS 76</div>
      </div>
    </header>

    <div id="home-page">
      <section class="welcome">
        <div class="welcome-inner">
          <div class="welcome-emoji">🍣</div>
          <div>
            <h2 id="welcome-name">Chargement...</h2>
            <p>Bienvenue sur le shop premium</p>
          </div>
        </div>
      </section>

      <div id="products-grid">
        <!-- Produits -->
        <div class="card" data-key="cali">
          <div class="card-img">
            <video autoplay muted loop playsinline poster="cali-thumb.jpg">
              <source src="cali.mp4" type="video/mp4">
            </video>
            <div class="badge-star">★</div>
          </div>
          <div class="card-body">
            <div class="card-title">🇺🇸 Cali weed🌳</div>
            <div class="card-info">Runtz / Tropicana Strawberry</div>
          </div>
        </div>
        <div class="card" data-key="gaz">
          <div class="card-img">
            <video autoplay muted loop playsinline poster="gaz-thumb.jpg">
              <source src="gaz.mp4" type="video/mp4">
            </video>
            <div class="badge-star">★</div>
          </div>
          <div class="card-body">
            <div class="card-title">⚡️ Dry 90u</div>
            <div class="card-info">Gaz fruit🍇</div>
          </div>
        </div>
      </div>
    </div>

    <div id="product-detail" style="display:none;">
      <div class="product-hero">
        <video id="detail-video" autoplay muted loop playsinline></video>
      </div>
      <div class="product-title" id="detail-title"></div>
      <div class="badges">
        <div class="badge badge-strain" id="detail-strain"></div>
      </div>
      <div class="strain-section" id="detail-strain-desc"></div>
      <div class="quantity-section">
        <div class="quantity-title"><span>🛍️</span> Sélectionner la Quantité</div>
        <div class="quantity-grid" id="qty-grid"></div>
      </div>
      <button class="add-to-cart" id="add-to-cart-btn"><span>🛒</span> Ajouter au Panier</button>
    </div>

    <div id="cart-page">
      <div class="cart-header">
        <h2 style="font-size:1.4rem; color:#ff50b4;">Votre Panier</h2>
        <button id="clear-cart-btn" class="clear-cart-btn">Vider le panier</button>
      </div>
      <div id="cart-items"></div>
    </div>

    <nav>
      <div class="nav-item active" id="nav-home">
        <span>Accueil</span>
      </div>
      <div class="nav-item" id="nav-cart">
        <span>Panier</span>
        <span id="cart-badge"></span>
      </div>
    </nav>

  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe?.user;
  document.getElementById('welcome-name').textContent = user
    ? `Salut ${user.first_name || 'Farmer'} !`
    : 'Bienvenue !';

  const products = {
    cali: { title: '🇺🇸 Cali weed🌳', video: 'cali.mp4', poster: 'cali-thumb.jpg', strain: 'Runtz 🌈✅ Tropicana Strawberry 🌴🍓✅', quantities: [{ qty: '3G', price: '40 €' }, { qty: '5G', price: '60 €' }] },
    gaz: { title: '⚡️ Dry 90u', video: 'gaz.mp4', poster: 'gaz-thumb.jpg', strain: 'Papaya Dolce 🥭✅ Mimi Cheese 🧀✅', quantities: [{ qty: '10G', price: '130 €' }, { qty: '25G', price: '240 €' }] }
  };

  let cart = JSON.parse(localStorage.getItem('cart') || '[]');

  function hideAllPages() {
    document.getElementById('home-page').style.display='none';
    document.getElementById('product-detail').style.display='none';
    document.getElementById('cart-page').style.display='none';
    document.getElementById('btn-back').style.display='none';
  }

  function updateBadge() {
    const badge = document.getElementById('cart-badge');
    if(cart.length>0){ badge.textContent = cart.length; badge.style.display='block'; }
    else badge.style.display='none';
  }

  function saveCart(){ localStorage.setItem('cart', JSON.stringify(cart)); updateBadge(); }

  function openProductDetail(key){
    const p=products[key];
    if(!p) return;
    const hero=document.getElementById('detail-video');
    hero.innerHTML=`<source src="${p.video}" type="video/mp4">`;
    hero.poster=p.poster||'';
    document.getElementById('detail-title').textContent=p.title;
    document.getElementById('detail-strain').textContent=p.strain;
    document.getElementById('detail-strain-desc').innerHTML=`<div class="strain-title">Strain</div>${p.strain}`;
    const grid=document.getElementById('qty-grid');
    grid.innerHTML='';
    p.quantities.forEach((item,idx)=>{
      const btn=document.createElement('button');
      btn.className='qty-btn'; btn.dataset.index=idx;
      btn.innerHTML=`${item.qty}<br>${item.price}`;
      btn.onclick=()=>{ grid.querySelectorAll('.qty-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); };
      grid.appendChild(btn);
    });
    hideAllPages();
    document.getElementById('product-detail').style.display='block';
    document.getElementById('btn-back').style.display='inline-block';
  }

  document.querySelectorAll('#products-grid .card').forEach(card=>{ card.addEventListener('click',()=>openProductDetail(card.dataset.key)); });

  document.getElementById('btn-back').onclick=()=>{
    hideAllPages(); document.getElementById('home-page').style.display='block';
  };

  document.getElementById('add-to-cart-btn').onclick=()=>{
    const selected=document.querySelector('.qty-btn.selected');
    if(!selected) return tg.showPopup({message:'Sélectionnez une quantité !'});
    const key = Object.keys(products).find(k=>products[k].title===document.getElementById('detail-title').textContent.trim());
    const item = products[key].quantities[selected.dataset.index];
    cart.push({ title:products[key].title, qty:item.qty, price:item.price });
    saveCart();
    tg.showPopup({message:'Ajouté au panier !'});
  };

  function showCart(){
    hideAllPages();
    document.getElementById('cart-page').style.display='block';
    const itemsDiv=document.getElementById('cart-items');
    itemsDiv.innerHTML='';
    if(cart.length===0){ itemsDiv.innerHTML='<p style="text-align:center; color:#888; padding:40px 0;">Votre panier est vide</p>'; return; }
    cart.forEach((item,idx)=>{
      const div=document.createElement('div');
      div.className='cart-item';
      div.innerHTML=`<span>${item.title}</span> <span>${item.qty} - ${item.price}</span> <button class="delete-item">X</button>`;
      div.querySelector('.delete-item').onclick=()=>{ cart.splice(idx,1); saveCart(); showCart(); };
      itemsDiv.appendChild(div);
    });
  }

  document.getElementById('clear-cart-btn').onclick=()=>{ if(confirm('Vider le panier ?')){ cart=[]; saveCart(); showCart(); } };

  document.getElementById('nav-home').onclick=()=>{ hideAllPages(); document.getElementById('home-page').style.display='block'; };
  document.getElementById('nav-cart').onclick=showCart;

  updateBadge();
</script>

</body>
</html>
